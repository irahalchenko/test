<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Діагностика підсвідомих програм</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 20px; 
            background-color: #0f172a; 
            color: #e2e8f0; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
        }
        .card { 
            background: #1e293b; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            border: 1px solid #334155;
            width: 100%; 
            box-sizing: border-box; 
        }
        h1, h2 { 
            text-align: center; 
            margin-top: 0; 
            color: #eebb99; 
            font-weight: 700;
        }
        .colibri-container { text-align: center; margin-bottom: 10px; }
        .colibri-icon { width: 48px; height: 48px; fill: #eebb99; }
        .intro-text { text-align: center; margin-bottom: 20px; line-height: 1.6; color: #cbd5e1; font-size: 15px; }
        .input-field {
            width: 100%; background: #0f172a; border: 1px solid #334155; color: #e2e8f0;
            padding: 14px 15px; border-radius: 10px; margin-bottom: 15px; font-size: 15px;
            box-sizing: border-box; font-family: inherit; transition: border-color 0.3s;
        }
        .input-field:focus { outline: none; border-color: #eebb99; }
        .input-error { border-color: #ef4444 !important; background-color: rgba(239, 68, 68, 0.05); }
        .error-message { color: #ef4444; font-size: 13px; text-align: center; margin-bottom: 15px; display: none; }
        
        .progress-container { width: 100%; background-color: #334155; border-radius: 10px; margin-bottom: 20px; height: 8px; overflow: hidden; display: none; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #b76e79, #eebb99); width: 0%; transition: width 0.3s ease; }
        .question-counter { text-align: center; font-size: 13px; color: #94a3b8; margin-bottom: 15px; display: none; }
        .question-text { font-size: 19px; font-weight: 600; text-align: center; margin-bottom: 30px; min-height: 70px; display: flex; align-items: center; justify-content: center; color: #fff; }
        .options-grid { display: grid; gap: 12px; }
        .option-btn { 
            background: #0f172a; border: 1px solid #334155; color: #e2e8f0; padding: 16px; 
            border-radius: 12px; font-size: 15px; text-align: left; cursor: pointer; display: flex; align-items: center; 
        }
        .option-btn:hover { border-color: #b76e79; background-color: #1e293b; }
        .option-number { 
            font-weight: bold; margin-right: 15px; background: #334155; color: #eebb99;
            width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 12px; flex-shrink: 0;
        }
        .result-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #334155; font-size: 15px; }
        .result-title { font-weight: 500; color: #cbd5e1; }
        .result-score { font-weight: bold; color: #fff; }
        .primary-btn { 
            width: 100%; padding: 16px; background: linear-gradient(135deg, #b76e79, #eebb99); color: #0f172a; 
            border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 15px; text-transform: uppercase;
        }
        .secondary-btn { background: transparent; color: #eebb99; border: 2px solid #eebb99; margin-top: 15px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="card" id="intro-screen">
        <div class="colibri-container">
            <svg class="colibri-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M21.5,10.5 L19.5,11.5 C19.5,11.5 18,9 15.5,8 C13,7 10.5,8.5 10.5,8.5 L7.5,6 L6.5,7 L8,9.5 C8,9.5 6,10 4.5,12 C3,14 2,17 2,17 C2,17 4.5,16 6.5,14.5 C8.5,13 10,13 10,13 L11.5,16.5 C11.5,16.5 14,16 15,14 C16,12 16,9.5 16,9.5 L19,10 C19,10 20.5,9.5 21.5,10.5 Z M9,11 C8.447,11 8,10.553 8,10 C8,9.447 8.447,9 9,9 C9.553,9 10,9.447 10,10 C10,10.553 9.553,11 9,11 Z"/>
            </svg>
        </div>
        <h1>Діагностика метапрограм</h1>
        <div class="intro-text">
           Цей тест виявить ваші підсвідомі програми — автоматичні сценарії, що керують рішеннями. Оцінюйте щиро.
        </div>
        
        <div class="user-form">
            <input type="text" id="userName" class="input-field" placeholder="Ваше ім'я">
            <input type="text" id="userDob" class="input-field" placeholder="Дата народження (дд.мм.рррр)">
            <textarea id="userRequest" class="input-field" rows="3" placeholder="Опиши свій запит: що хочеться побачити, зрозуміти, усвідомити, вирішити? Що поснійно повторюється у твоєму житті або з чим маєш проблеми?"></textarea>
            <div id="form-error" class="error-message">Будь ласка, заповніть усі поля, щоб почати.</div>
        </div>

        <button class="primary-btn" onclick="startTest()">Почати тест</button>
    </div>

    <div class="card hidden" id="quiz-screen">
        <div class="progress-container" id="progress-container"><div class="progress-bar" id="progress-bar"></div></div>
        <div class="question-counter" id="question-counter"></div>
        <div class="question-text" id="question-text"></div>
        <div class="options-grid">
            <button class="option-btn" onclick="nextQuestion(1)"><span class="option-number">1</span> Зовсім не про мене</button>
            <button class="option-btn" onclick="nextQuestion(2)"><span class="option-number">2</span> Рідко / Іноді</button>
            <button class="option-btn" onclick="nextQuestion(3)"><span class="option-number">3</span> Скоріше ні</button>
            <button class="option-btn" onclick="nextQuestion(4)"><span class="option-number">4</span> Скоріше так</button>
            <button class="option-btn" onclick="nextQuestion(5)"><span class="option-number">5</span> Майже завжди</button>
            <button class="option-btn" onclick="nextQuestion(6)"><span class="option-number">6</span> Точно про мене</button>
        </div>
    </div>

    <div class="card hidden" id="result-screen">
        <h2>Ваші результати</h2>
        <div id="results-list" style="max-height: 400px; overflow-y: auto; margin-bottom: 20px;"></div>
        <button class="primary-btn" onclick="sendEmail()">✉️ Надіслати результати</button>
        <button class="primary-btn secondary-btn" onclick="copyResults()">📋 Скопіювати текст</button>
        <button class="primary-btn secondary-btn" onclick="location.reload()">🔄 Пройти знову</button>
    </div>

    <script>
        const schemas = [
            { title: "1. Неповноцінне Я / злиття", questions: [ "Я не знаю, чого хочу я, але точно знаю, чого хоче мій партнер/батьки.", "Мені важко дозволити собі піти кудись або купити щось без узгодження з рідними — я одразу починаю відчувати за це провину.", "Я переймаю емоції, інтереси та звички людей, з якими спілкуюся.", "Якщо у моєї близької людини поганий настрій, мій день теж зіпсований, я не можу від цього відгородитися.", "Я відчуваю порожнечу, коли залишаюся одна (один)." ]},
            { title: "2. Емоційний голод (емоційна депривація)", questions: [ "Я почуваюся самотньо навіть поруч із близькими, ніби між нами невидима стіна.", "Мені завжди не вистачало і не вистачає тепла, обіймів і слів підтримки.", "Ніхто по-справжньому не знає і не розуміє моїх глибоких почуттів.", "Я часто відчуваю, що мої потреби неважливі для інших.", "Я часто ображаюся мовчки, сподіваючись, що хтось помітить мій стан, але на прямі запитання відповідаю: «Все нормально»." ]},
            { title: "3. Покинутість / нестабільність", questions: [ "Я часто перевіряю, де мій партнер і з ким, бо мені важко витримувати невідомість.", "У мене бувають періоди, коли я ніби «випробовую» терпіння близьких, щоб отримати доказ того, що вони мене не кинуть.", "Я чіпляюся за людей, бо думка залишитися на самоті викликає в мене паніку.", "Якщо я не отримую швидкої відповіді на повідомлення, мене накриває паніка або злість.", "Я чіпляюся за стосунки, сама (сам) не зна чому." ]},
            { title: "4. Недовіра / жорстоке поводження", questions: [ "Я завжди насторожі, бо мені здається, що люди мене використають або зрадять.", "Якщо хтось занадто добрий до мене, я думаю: що йому від мене треба?", "Краще я вдарю першим (словом чи дією), ніж буду чекати, поки 'вдарять' мене.", "Я тримаю людей на безпечній відстані та не відкриваюся до кінця, щоб вони не могли знайти мої слабкі місця і вдарити по них.", "Люди думають тільки про себе, і якщо я розслаблюсь, вони цим скористаються." ]},
            { title: "5. Соціальна ізоляція", questions: [ "Я почуваюся чужим/ою в будь-якій компанії.", "Навіть коли я спілкуюся і сміюся з усіма, всередині я почуваюся аутсайдером, який лише вдає, що він є частиною цієї групи.", "Я уникаю нових знайомств, знаходячи тисячу причин, чому ці люди мені нецікаві.", "Я завжди тримаюся на відстані від колективу.", "Я відчуваю, що ніде не маю справжнього дому чи спільноти." ]},
            { title: "6. Поломаність / сором", questions: [ "Якщо люди дізнаються про мої недоліки, вони можуть відвернутися від мене.", "Я відчуваю себе «якоюсь не такою», негідним/ою любові.", "Я дозволяю іншим ставитися до мене погано, бо десь глибоко вважаю, що я на це заслуговую.", "Я часто порівнюю себе з іншими не на свою користь.", "У всіх усе, як у людей, а зі мною вічно щось не так." ]},
            { title: "7. Підкорення", questions: [ "Я погоджуюся з іншими, щоб уникнути конфлікту чи гніву.", "Я не вмію відстоювати свою думку.", "Я можу зробити те, що не хочу, просто тому, що мене попросили.", "Я відчуваю, що моє життя керується бажаннями інших, і це викликає в мене злість.", "Я придушую своє невдоволення, поки не вибухну." ]},
            { title: "8. Песимізм / негативізм", questions: [ "Навіть якщо все добре, я знаю, що це ненадовго.", "Я не песиміст, я — реаліст. Більшість людей живуть у рожевих окулярах і не бачать реальних загроз, які бачу я.", "Я стараюся не радіти, щоб потім не розчаровуватися.", "Я помічаю деталі, які зроблені неправильно, навіть якщо загальна картина добра.", "Обов'язково щось піде не так!" ]},
            { title: "9. Пророчество / Вразливість", questions: [ "Я не можу розслабитися, бо боюся, що трапиться щось погане (хвороба, аварія, банкрутство).", "Я читаю всі негативні новини і приміряю ситуації на себе, щоб бути «готовим».", "Я постійно перевіряю все по кілька разів, щоб уникнути біди.", "Мені здається, що якщо я хоча б на мить розслаблюся і перестану все контролювати, обов'язково станеться щось жахливе.", "Будь-яка негативна новина викликає в мене сильну тривогу за майбутнє." ]},
            { title: "10. Провал / невдаха", questions: [ "Я досяг/ла значно менше, ніж мої однолітки.", "Я відчуваю себе невдахою у професійному плані.", "Немає сенсу навіть намагатися, все одно нічого не вийде.", "Я часто кидаю справи, коли не бачу в них успішного завершення.", "Я соромлюся своїх кар'єрних чи інших результатів перед іншими." ]},
            { title: "11. Перфекціонізм / суворість до себе", questions: [ "Я повинен/на бути найкращим/ою у всьому, що роблю.", "Я не задоволений/а своїми результатами, завжди можна краще.", "Я почуваюся винним/ою або тривожним/ою, коли просто відпочиваю і нічим 'корисним' не займаюся.", "Я намагаюся робити все ідеально і дратуюся, якщо щось іде не так.", "Я не дозволяю собі поїсти або піти в туалет, поки не закінчу цей шматок роботи." ]},
            { title: "12. Залежність", questions: [ "Я боюся приймати важливі рішення без поради з іншими.", "Я відчуваю сильну тривогу, коли мені доводиться робити щось нове самостійно (поїздка, документи).", "Я часто відчуваю безпорадність перед побутовими проблемами.", "Я дозволяю партнеру/батькам керувати моїм життям, навіть якщо це мене дратує.", "Я відчуваю себе дитиною в дорослому світі, яка не знає, що робити." ]},
            { title: "13. Привілейованість", questions: [ "Мені складно приймати відмови.", "Я дратуюся, коли доводиться чекати або дотримуватися загальних правил.", "Мої потреби важливіші за потреби інших людей.", "Я маю право робити те, що хочу, незважаючи на наслідки для інших.", "Люди повинні поступатися мені." ]},
            { title: "14. Інструкції / покарання", questions: [ "Я почуваюся спокійно лише тоді, коли дію чітко за планом.", "Люди, які не докладають максимум зусиль, викликають у мене зневагу.", "Я вважаю, що якщо людина помилилася, вона має спокутувати провину.", "В основному я не даю собі права на слабкість.", "Мені важко співчувати людям, які самі створили собі проблеми." ]},
            { title: "15. Самопожертва", questions: [ "Я відчуваю себе eгoїстом, коли витрачаю час на себе.", "Я допомагаю іншим, але буває образа, що вони не цінують моїх зусиль.", "Мені легше віддати останнє, ніж відмовити.", "Я вигораю, піклуючись про всіх, крім себе.", "Люди часто використовують мою доброту." ]},
            { title: "16. Емоційне гальмування", questions: [ "Я контролюю емоції, щоб не виглядати слабким/ою.", "Люди вважають мене холодним/ою або занадто серйозним/ою.", "Я соромлюся плакати або голосно сміятися при людях.", "Коли інші плачуть, мені стає ніяково.", "Мені важко бути спонтанним/ою." ]},
            { title: "17. Недостатній самоконтроль", questions: [ "Я часто обираю швидке задоволення.", "Мені важко змусити себе робити нудну роботу.", "Мені важко доводити справи до кінця.", "Я часто відкладаю все на потім.", "Я обіцяю собі почати «нове життя», але зриваюся." ]},
            { title: "18. Пошук схвалення", questions: [ "Я боюся виглядати безглуздо.", "Після розмови я прокручую свої репліки в голові.", "Моя самооцінка залежить від похвали.", "Я автоматично підтакую співрозмовнику.", "Я почуваюся спустошеним, якщо мої зусилля не помітили." ]}
        ];

        let questions = [];
        let currentIdx = 0;
        let scores = new Array(18).fill(0);
        let uName = "", uDob = "", uReq = "";

        function startTest() {
            const nameField = document.getElementById('userName');
            const dobField = document.getElementById('userDob');
            const reqField = document.getElementById('userRequest');
            const errorMsg = document.getElementById('form-error');

            uName = nameField.value.trim();
            uDob = dobField.value.trim();
            uReq = reqField.value.trim();

            // Очищення попередніх підсвіток
            nameField.classList.remove('input-error');
            dobField.classList.remove('input-error');
            reqField.classList.remove('input-error');
            errorMsg.style.display = 'none';

            // Перевірка полів
            let hasError = false;
            if (!uName) { nameField.classList.add('input-error'); hasError = true; }
            if (!uDob) { dobField.classList.add('input-error'); hasError = true; }
            if (!uReq) { reqField.classList.add('input-error'); hasError = true; }

            if (hasError) {
                errorMsg.style.display = 'block';
                return;
            }
            
            // Формування масиву питань
            questions = [];
            schemas.forEach((s, i) => s.questions.forEach(q => questions.push({ text: q, sIdx: i })));
            
            // Перемішування
            for (let i = questions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const temp = questions[i];
                questions[i] = questions[j];
                questions[j] = temp;
            }
            
            // Перехід на екран тесту
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('progress-container').style.display = 'block';
            document.getElementById('question-counter').style.display = 'block';
            
            render();
        }

        function render() {
            document.getElementById('question-text').innerText = questions[currentIdx].text;
            document.getElementById('progress-bar').style.width = (currentIdx / questions.length * 100) + "%";
            document.getElementById('question-counter').innerText = `Питання ${currentIdx + 1} з ${questions.length}`;
        }

        function nextQuestion(val) {
            scores[questions[currentIdx].sIdx] += val;
            currentIdx++;
            if (currentIdx < questions.length) {
                render();
            } else {
                finish();
            }
        }

        function finish() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            let html = "";
            schemas.forEach((s, i) => {
                let perc = Math.round((scores[i] / 30) * 100);
                html += `<div class="result-item"><span class="result-title">${s.title}</span><span class="result-score">${perc}%</span></div>`;
            });
            document.getElementById('results-list').innerHTML = html;
        }

        function getText() {
            let t = `Ім'я: ${uName}\nДата: ${uDob}\nЗапит: ${uReq}\n\n`;
            schemas.forEach((s, i) => {
                t += `${s.title}: ${Math.round((scores[i] / 30) * 100)}%\n`;
            });
            return t;
        }

        function copyResults() {
            navigator.clipboard.writeText(getText()).then(() => alert("Результат скопійовано!"));
        }

        function sendEmail() {
            window.location.href = `mailto:ira.halchenko@gmail.com?subject=Результати&body=${encodeURIComponent(getText())}`;
        }
    </script>
</body>
</html>
