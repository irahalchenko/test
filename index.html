<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Діагностика підсвідомих програм</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 20px; 
            background-color: #0f172a; 
            color: #e2e8f0; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
        }
        .card { 
            background: #1e293b; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            border: 1px solid #334155;
            width: 100%; 
            box-sizing: border-box; 
        }
        h1, h2 { 
            text-align: center; 
            margin-top: 0; 
            color: #eebb99; 
            font-weight: 700;
        }
        .colibri-container { text-align: center; margin-bottom: 10px; }
        .colibri-icon { width: 48px; height: 48px; fill: #eebb99; }
        .intro-text { text-align: center; margin-bottom: 20px; line-height: 1.6; color: #cbd5e1; font-size: 15px; }
        .input-field {
            width: 100%; background: #0f172a; border: 1px solid #334155; color: #e2e8f0;
            padding: 14px 15px; border-radius: 10px; margin-bottom: 15px; font-size: 15px;
            box-sizing: border-box; font-family: inherit; transition: border-color 0.3s;
        }
        .input-field:focus { outline: none; border-color: #eebb99; }
        .input-error { border-color: #ef4444 !important; background-color: rgba(239, 68, 68, 0.05); }
        .error-message { color: #ef4444; font-size: 13px; text-align: center; margin-bottom: 15px; display: none; }
        
        .progress-container { width: 100%; background-color: #334155; border-radius: 10px; margin-bottom: 20px; height: 8px; overflow: hidden; display: none; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #b76e79, #eebb99); width: 0%; transition: width 0.3s ease; }
        .question-counter { text-align: center; font-size: 13px; color: #94a3b8; margin-bottom: 15px; display: none; }
        .question-text { font-size: 19px; font-weight: 600; text-align: center; margin-bottom: 30px; min-height: 70px; display: flex; align-items: center; justify-content: center; color: #fff; }
        .options-grid { display: grid; gap: 12px; }
        .option-btn { 
            background: #0f172a; border: 1px solid #334155; color: #e2e8f0; padding: 16px; 
            border-radius: 12px; font-size: 15px; text-align: left; cursor: pointer; display: flex; align-items: center; 
        }
        .option-btn:hover { border-color: #b76e79; background-color: #1e293b; }
        .option-number { 
            font-weight: bold; margin-right: 15px; background: #334155; color: #eebb99;
            width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 12px; flex-shrink: 0;
        }
        .result-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #334155; font-size: 15px; }
        .result-title { font-weight: 500; color: #cbd5e1; }
        .result-score { font-weight: bold; color: #fff; }
        .primary-btn { 
            width: 100%; padding: 16px; background: linear-gradient(135deg, #b76e79, #eebb99); color: #0f172a; 
            border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 15px; text-transform: uppercase;
        }
        .secondary-btn { background: transparent; color: #eebb99; border: 2px solid #eebb99; margin-top: 15px; }
        .hidden { display: none; }
        .send-status { display: none; margin-top: 15px; padding: 14px; border-radius: 10px; background: #0f172a; border: 1px solid #b76e79; color: #e2e8f0; font-size: 14px; line-height: 1.5; text-align: center; }
        .send-status a { color: #eebb99; }
    </style>
</head>
<body>

    <div class="card" id="intro-screen">
        <div class="colibri-container">
            <svg class="colibri-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M21.5,10.5 L19.5,11.5 C19.5,11.5 18,9 15.5,8 C13,7 10.5,8.5 10.5,8.5 L7.5,6 L6.5,7 L8,9.5 C8,9.5 6,10 4.5,12 C3,14 2,17 2,17 C2,17 4.5,16 6.5,14.5 C8.5,13 10,13 10,13 L11.5,16.5 C11.5,16.5 14,16 15,14 C16,12 16,9.5 16,9.5 L19,10 C19,10 20.5,9.5 21.5,10.5 Z M9,11 C8.447,11 8,10.553 8,10 C8,9.447 8.447,9 9,9 C9.553,9 10,9.447 10,10 C10,10.553 9.553,11 9,11 Z"/>
            </svg>
        </div>
        <h1>Діагностика метапрограм</h1>
        <div class="intro-text">
           Цей тест виявить ваші підсвідомі програми — автоматичні сценарії, що керують рішеннями. Оцінюйте щиро.
        </div>
        
        <div class="user-form">
            <input type="text" id="userName" class="input-field" placeholder="Ваше ім'я">
            <input type="text" id="userDob" class="input-field" placeholder="Дата народження (дд.мм.рррр)">
            <textarea id="userRequest" class="input-field" rows="3" placeholder="Опиши свій запит: що хочеться побачити, зрозуміти, усвідомити, вирішити? Що постійно повторюється у твоєму житті або з чим маєш проблеми?"></textarea>
            <div id="form-error" class="error-message">Будь ласка, заповніть усі поля, щоб почати.</div>
        </div>

        <button class="primary-btn" onclick="startTest()">Почати тест</button>
    </div>

    <div class="card hidden" id="quiz-screen">
        <div class="progress-container" id="progress-container"><div class="progress-bar" id="progress-bar"></div></div>
        <div class="question-counter" id="question-counter"></div>
        <div class="question-text" id="question-text"></div>
        <div class="options-grid">
            <button class="option-btn" onclick="nextQuestion(1)"><span class="option-number">1</span> Зовсім не про мене / Ніколи</button>
            <button class="option-btn" onclick="nextQuestion(2)"><span class="option-number">2</span> Скоріше ні / Рідко</button>
            <button class="option-btn" onclick="nextQuestion(3)"><span class="option-number">3</span> Іноді / Частково</button>
            <button class="option-btn" onclick="nextQuestion(4)"><span class="option-number">4</span> Скоріше так / Часто</button>
            <button class="option-btn" onclick="nextQuestion(5)"><span class="option-number">5</span> Майже завжди / Здебільшого так</button>
            <button class="option-btn" onclick="nextQuestion(6)"><span class="option-number">6</span> Точно про мене / Завжди</button>
        </div>
    </div>

    <div class="card hidden" id="result-screen">
        <h2>Ваші результати</h2>
        <div id="results-list" style="max-height: 400px; overflow-y: auto; margin-bottom: 20px;"></div>
        <button class="primary-btn" onclick="sendEmail()">✉️ Надіслати результати</button>
        <div id="send-status" class="send-status"></div>
        <button class="primary-btn secondary-btn" onclick="copyResults()">📋 Скопіювати текст</button>
        <button class="primary-btn secondary-btn" onclick="location.reload()">🔄 Пройти знову</button>
    </div>

    <script>
        const RECIPIENT = "ira.halchenko@gmail.com";

        const schemas = [
            { title: "1. Неповноцінне Я / злиття", questions: [ "Я не знаю, чого хочу я, але точно знаю, чого хоче мій партнер/батьки.", "Мені важко дозволити собі піти кудись або купити щось без узгодження з рідними — я одразу починаю відчувати за це провину.", "Я переймаю емоції, інтереси та звички людей, з якими спілкуюся.", "Якщо у моєї близької людини поганий настрій, мій день теж зіпсований, я не можу від цього легко відгородитися.", "Я відчуваю порожнечу, коли залишаюся одна (один)." ]},
            { title: "2. Емоційний голод (емоційна депривація)", questions: [ "Навіть поруч із близькими мені буває самотньо, бо ніхто по-справжньому не цікавиться, як я.", "Мені завжди не вистачало і не вистачає тепла, обіймів і слів підтримки.", "Ніхто по-справжньому не знає і не розуміє моїх глибоких почуттів.", "Я часто відчуваю, що мої потреби неважливі для інших.", "Я часто ображаюся мовчки, чесно кажучи, хочу, щоб хтось помітив мій стан, але на прямі запитання відповідаю: «Все нормально»." ]},
            { title: "3. Покинутість / нестабільність", questions: [ "Я часто перевіряю, де мій партнер і з ким, бо мені важко витримувати невідомість.", "У мене бувають періоди, коли я ніби «випробовую» терпіння близьких, щоб отримати доказ того, що я їм потрібна/ий.", "Мені дуже важко відпускати людей, навіть коли стосунки вже не радують, бо думка залишитися на самоті лякає.", "Якщо я не отримую швидкої відповіді на повідомлення, мене накриває паніка або злість.", "Я тримаюся за стосунки, навіть коли сама (сам) не розумію, що мене в них тримає." ]},
            { title: "4. Недовіра / жорстоке поводження", questions: [ "Я завжди насторожі, бо мені здається, що люди мене використають або зрадять.", "Коли хтось до мене надто добрий, мені це здається підозрілим або незрозумілим.", "Краще я «вдарю» першим (словом чи дією), ніж буду чекати, поки «вдарять» мене.", "Я тримаю людей на безпечній відстані та не відкриваюся до кінця", "Люди думають тільки про себе, і якщо я розслаблюсь, вони цим скористаються." ]},
            { title: "5. Соціальна ізоляція", questions: [ "Я почуваюся чужим/ою в будь-якій компанії.", "Навіть коли я спілкуюся і сміюся з усіма, всередині я почуваюся аутсайдером, який лише вдає, що він є частиною цієї групи.", "Я уникаю нових знайомств, мені не цікаві ті люди.", "Я тримаюся на відстані від колективу.", "Я відчуваю, що ніде не маю справжнього дому чи спільноти." ]},
            { title: "6. Поломаність / сором", questions: [ "Я стараюсь ховати свої недоліки, бо мені здається, що люди можуть їх не прийняти або не зрозуміти мене.", "Я відчуваю себе «якоюсь не такою», негідним/ою любові.", "Я дозволяю іншим ставитися до мене недобре, бо десь глибоко вважаю, що я на це заслуговую.", "Я часто порівнюю себе з іншими не на свою користь.", "У всіх усе, як у людей, а зі мною вічно щось не так." ]},
            { title: "7. Підкорення", questions: [ "Я погоджуюся з іншими, щоб уникнути конфлікту чи гніву.", "Я не вмію відстоювати свою думку.", "Я можу зробити те, що не хочу, просто тому, що мене попросили.", "Я відчуваю, що моє життя керується бажаннями інших, і це викликає в мене злість.", "Я придушую своє невдоволення, поки не вибухну." ]},
            { title: "8. Песимізм / негативізм", questions: [ "Навіть якщо все добре, я знаю, що це ненадовго.", "Я не песиміст, я — реаліст. Більшість людей живуть у рожевих окулярах і не бачать реальних загроз, які бачу я.", "Я стараюся сильно не радіти, щоб потім не розчаровуватися.", "Я помічаю деталі, які зроблені неправильно, навіть якщо загальна картина хороша.", "Обов'язково щось піде не так!" ]},
            { title: "9. Очікування біди / Вразливість", questions: [ "Я не можу розслабитися, бо боюся, що трапиться щось погане (хвороба, аварія, банкрутство).", "Я читаю новини і приміряю ситуації на себе, щоб бути «готовим».", "Я постійно перевіряю все по кілька разів, щоб уникнути біди.", "Мені здається, що якщо я хоча б на мить розслаблюся і перестану все контролювати, обов'язково щось піде не так.", "Будь-яка негативна новина викликає в мене сильну тривогу за майбутнє." ]},
            { title: "10. Провал / невдаха", questions: [ "Я досяг/ла значно менше, ніж можна було б.", "Я відчуваю себе невдахою у професійному плані.", "Немає сенсу навіть намагатися, все одно нічого не вийде.", "Я часто кидаю справи, коли не бачу в них успішного завершення.", "Мені незручно розповідати іншим про свої результати, бо здається, що хвалитися поки нема чим." ]},
            { title: "11. Перфекціонізм / суворість до себе", questions: [ "Я повинен/на бути найкращим/ою у всьому, що роблю.", "Я не задоволений/а своїми результатами, завжди можна краще.", "Я почуваюся винним/ою або тривожним/ою, коли просто відпочиваю і нічим 'корисним' не займаюся.", "Я намагаюся робити все ідеально і дратуюся, якщо щось іде не так.", "Я не дозволяю собі поїсти або піти в туалет, поки не закінчу цей шматок роботи." ]},
            { title: "12. Залежність", questions: [ "Мені страшно приймати важливе рішення, поки я не порадилася (порадився) з кимось.", "Я відчуваю сильну тривогу, коли мені доводиться робити щось нове самостійно (поїздка, документи).", "Я почуваюся безпорадно, коли треба самій (самому) розібратися з побутом: щось полагодити, розібратися з рахунками, записатися до лікаря.", "Я дозволяю партнеру/батькам керувати моїм життям, навіть якщо це мене дратує.", "Я відчуваю себе дитиною в дорослому світі, яка не знає, що робити." ]},
            { title: "13. Привілейованість", questions: [ "Мені складно приймати відмови.", "Я дратуюся, коли доводиться чекати або дотримуватися загальних правил.", "Мої потреби важливіші за потреби інших людей.", "Якщо мені чогось дуже хочеться, я це роблю, навіть коли розумію, що комусь від цього буде незручно.", "Люди повинні поступатися мені." ]},
            { title: "14. Інструкції / покарання", questions: [ "Я почуваюся спокійно лише тоді, коли дію чітко за планом.", "Люди, які не докладають максимум зусиль, викликають у мене зневагу.", "Я вважаю, що якщо людина помилилася, вона має спокутувати провину.", "В основному я не даю собі права на слабкість.", "Мені важко співчувати людям, які самі створили собі проблеми." ]},
            { title: "15. Самопожертва", questions: [ "Коли я виділяю час тільки для себе, мене гризе думка, що це егоїстично.", "Я допомагаю іншим, але буває образа, що вони не цінують моїх зусиль.", "Мені легше віддати останнє, ніж відмовити.", "Я вигораю, піклуючись про всіх, крім себе.", "Люди часто використовують мою доброту." ]},
            { title: "16. Емоційне гальмування", questions: [ "Я контролюю емоції, щоб не виглядати слабким/ою.", "Люди вважають мене холодним/ою або занадто серйозним/ою.", "Я соромлюся плакати або голосно сміятися при людях.", "Коли хтось поруч плаче, я не знаю, куди себе подіти, і мені хочеться швидше це зупинити або піти.", "Мені важко бути спонтанним/ою." ]},
            { title: "17. Недостатній самоконтроль", questions: [ "Я часто обираю швидке задоволення (солодке, серіал, соцмережі, спонтанні покупки), навіть коли планував/ла інше.", "Мені важко змусити себе робити нудну роботу.", "Мені важко доводити справи до кінця.", "Я часто відкладаю все на потім.", "Я обіцяю собі почати «нове життя», але зриваюся." ]},
            { title: "18. Пошук схвалення", questions: [ "Я не люблю виглядати безглуздо.", "Після розмови я прокручую свої репліки в голові.", "Коли мене хвалять, я почуваюся більш впевнено, а якщо відгуку немає - починаю сумніватися в собі.", "У розмові я часто погоджуюся з людиною, навіть коли думаю інакше", "Мене спустошує, коли мої зусилля ніхто не помічає." ]}
        ];

        let questions = [];
        let currentIdx = 0;
        let scores = new Array(18).fill(0);
        let uName = "", uDob = "", uReq = "";

        function startTest() {
            const nameField = document.getElementById('userName');
            const dobField = document.getElementById('userDob');
            const reqField = document.getElementById('userRequest');
            const errorMsg = document.getElementById('form-error');

            uName = nameField.value.trim();
            uDob = dobField.value.trim();
            uReq = reqField.value.trim();

            nameField.classList.remove('input-error');
            dobField.classList.remove('input-error');
            reqField.classList.remove('input-error');
            errorMsg.style.display = 'none';

            let hasError = false;
            if (!uName) { nameField.classList.add('input-error'); hasError = true; }
            if (!uDob) { dobField.classList.add('input-error'); hasError = true; }
            if (!uReq) { reqField.classList.add('input-error'); hasError = true; }

            if (hasError) {
                errorMsg.style.display = 'block';
                return;
            }
            
            questions = [];
            schemas.forEach((s, i) => s.questions.forEach(q => questions.push({ text: q, sIdx: i })));
            
            for (let i = questions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const temp = questions[i];
                questions[i] = questions[j];
                questions[j] = temp;
            }
            
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('progress-container').style.display = 'block';
            document.getElementById('question-counter').style.display = 'block';
            
            render();
        }

        function render() {
            document.getElementById('question-text').innerText = questions[currentIdx].text;
            document.getElementById('progress-bar').style.width = (currentIdx / questions.length * 100) + "%";
            document.getElementById('question-counter').innerText = `Питання ${currentIdx + 1} з ${questions.length}`;
        }

        function nextQuestion(val) {
            scores[questions[currentIdx].sIdx] += val;
            currentIdx++;
            if (currentIdx < questions.length) {
                render();
            } else {
                finish();
            }
        }

        function finish() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            let html = "";
            schemas.forEach((s, i) => {
                let perc = Math.round((scores[i] / 30) * 100);
                html += `<div class="result-item"><span class="result-title">${s.title}</span><span class="result-score">${perc}%</span></div>`;
            });
            document.getElementById('results-list').innerHTML = html;
        }

        function getText() {
            let t = `Ім'я: ${uName}\nДата: ${uDob}\nЗапит: ${uReq}\n\n`;
            schemas.forEach((s, i) => {
                t += `${s.title}: ${Math.round((scores[i] / 30) * 100)}%\n`;
            });
            return t;
        }

        // Копіювання з запасним способом для браузерів, де clipboard API заблокований
        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(text).catch(() => legacyCopy(text));
            }
            return Promise.resolve(legacyCopy(text));
        }

        function legacyCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            let ok = false;
            try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
            document.body.removeChild(ta);
            return ok;
        }

        function copyResults() {
            copyToClipboard(getText()).then(() => alert("Результат скопійовано!"));
        }

        function sendEmail() {
            const text = getText();
            const subject = `Результати діагностики — ${uName}`;
            const mailto = `mailto:${RECIPIENT}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`;

            // Спершу копіюємо результати, щоб вони не загубилися, якщо пошта не відкриється
            copyToClipboard(text);

            // Посилання з кліком спрацьовує в більшій кількості браузерів, ніж window.location
            const a = document.createElement('a');
            a.href = mailto;
            a.target = '_top';
            a.rel = 'noopener';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            const status = document.getElementById('send-status');
            status.innerHTML = `Якщо поштова програма не відкрилась, результати вже скопійовані. Встав їх у лист на <a href="${mailto}">${RECIPIENT}</a> або надішли повідомленням.`;
            status.style.display = 'block';
        }
    </script>
</body>
</html>
